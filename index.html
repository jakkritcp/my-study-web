<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study & Exam Hub</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1519;--s1:#112027;--s2:#183039;--ln:#24424d;--tx:#dbe9ec;--mu:#7f9ca5;--ac:#2de2c4;--wa:#ffb347;--dg:#ff6b81;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eef5f6;--s1:#fff;--s2:#e2eef0;--ln:#bcd3d8;--tx:#10262c;--mu:#52717a;--ac:#00836f;--wa:#b36b00;--dg:#c52b46}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--s2);border:1px solid var(--ln);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#04201b;border-color:var(--ac);font-weight:600}
button.d:hover{border-color:var(--dg);color:var(--dg)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:7px 10px;width:100%}
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
aside{background:var(--s1);border-right:1px solid var(--ln);padding:16px;display:flex;flex-direction:column;gap:10px;max-height:100vh;position:sticky;top:0;overflow:auto}
h1{font-size:19px;margin:0;letter-spacing:.2px}h1 b{color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.c{border:1px solid var(--ln);border-left:3px solid var(--ln);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.c.on{border-left-color:var(--ac);background:var(--s2)}
.c small{color:var(--mu)}.code{color:var(--ac);font-weight:600}
.bar{height:6px;background:var(--s2);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
main{padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.hd{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.hd h2{margin:0;font-size:24px}.hd p{margin:2px 0 0;color:var(--mu)}
.cd{text-align:right}.cd .n{font-size:38px;font-weight:600;line-height:1;color:var(--ac)}.cd .n.w{color:var(--wa)}.cd .n.x{color:var(--dg)}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.box{background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:14px;min-width:0}
.box h3{margin:0 0 10px;font-size:15px;color:var(--mu);font-weight:500}
.f{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;border:1px solid transparent}
.f.on{border-color:var(--ac);background:var(--s2)}.f input{width:18px;height:18px;flex:none}.f .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.tag{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--s2);color:var(--ac);border:1px solid var(--ln)}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0}.chk input{width:18px;height:18px;accent-color:var(--ac)}
.view{height:460px;border-radius:8px;border:1px solid var(--ln);overflow:auto;background:var(--bg)}
.view iframe,.view embed{width:100%;height:100%;border:0;background:#fff}.view img{max-width:100%;display:block;margin:auto}
.view pre,.md{padding:14px;margin:0;white-space:pre-wrap;word-break:break-word}
.empty{padding:30px 16px;text-align:center;color:var(--mu)}
textarea{min-height:300px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.md h1,.md h2,.md h3{margin:.6em 0 .3em;color:var(--ac)}.md code{background:var(--s2);padding:1px 5px;border-radius:4px}.md li{margin-left:18px}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--ac);border-radius:10px;width:min(440px,92vw);padding:18px}
dialog::backdrop{background:#000a}dialog label{display:block;margin:10px 0 3px;color:var(--mu);font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button.on{border-color:var(--ac);color:var(--ac)}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--ln)}.grid{grid-template-columns:1fr}.cd{text-align:left}.view{height:380px}}
.ro .w{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app">
<aside>
 <div class="row"><h1>Study<b>Hub</b></h1><span class="sp"></span><button id="th" title="สลับธีม">◐</button></div>
 <input id="q" type="search" placeholder="ค้นหาวิชา หรือไฟล์ เช่น malware, pdf">
 <select id="cat"></select>
 <div id="list" class="row" style="flex-direction:column;align-items:stretch"></div>
 <button class="p w" id="addc">+ เพิ่มวิชาใหม่</button><small id="bn" style="color:var(--mu)"></small>
</aside>
<main id="main"></main>
</div>

<dialog id="dc"><form method="dialog" id="fc">
 <h3 id="dct" style="margin:0">เพิ่มวิชาใหม่</h3>
 <label>รหัสวิชา</label><input name="code" required>
 <label>ชื่อวิชา (อังกฤษ)</label><input name="en" required>
 <label>ชื่อวิชา (ไทย)</label><input name="th">
 <label>หมวดหมู่</label><input name="cat" placeholder="เช่น Security, Network" list="cl">
 <datalist id="cl"></datalist>
 <label>วันและเวลาสอบ</label><input name="exam" type="datetime-local">
 <div class="row" style="margin-top:14px"><span class="sp"></span><button type="button" onclick="dc.close()">ยกเลิก</button><button class="p">บันทึกวิชา</button></div>
</form></dialog>

<dialog id="dq"><p id="dqm" style="margin-top:0"></p><div class="row"><span class="sp"></span><button id="dqn">ยกเลิก</button><button class="p" id="dqy">ยืนยัน</button></div></dialog>
<dialog id="di"><form method="dialog" id="fi">
 <h3 style="margin:0">เพิ่มเนื้อหา</h3>
 <label>ชื่อเนื้อหา</label><input name="title" required>
 <label>ประเภท</label><select name="type"><option>PDF</option><option>Slide</option><option>Notes</option><option>Link</option></select>
 <div id="fw"><label>อัปโหลดไฟล์ (PDF, รูป, ข้อความ)</label><input name="file" type="file"></div>
 <label>หรือใส่ลิงก์</label><input name="url" type="url" placeholder="https://...">
 <div class="row" style="margin-top:14px"><span class="sp"></span><button type="button" onclick="di.close()">ยกเลิก</button><button class="p">เพิ่มเนื้อหา</button></div>
</form></dialog>

<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const STEPS=[["read","อ่านแล้ว"],["sum","สรุปแล้ว"],["quiz","ทำโจทย์แล้ว"]];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const seed=[["CP423211","Internetworking","การเชื่อมต่ออินเทอร์เน็ต","Network"],["CP423322","Malware Analysis and Protection","การวิเคราะห์และป้องกันมัลแวร์","Security"],["CP423431","Ethical Cybersecurity Hacking","การโจมตีไซเบอร์อย่างมีจริยธรรม","Security"],["CP423432","Cybersecurity Defense and Intrusion Detection/Protection","การป้องกันไซเบอร์และการตรวจจับป้องกันการบุกรุก","Security"],["CP423434","Cybersecurity Incident Event Handling","การจัดการเหตุการณ์ความผิดปกติด้านความมั่นคงปลอดภัยไซเบอร์","Security"]];
const mk=a=>({id:uid(),code:a[0],en:a[1],th:a[2],cat:a[3],exam:"",notes:"",checks:{},items:[]});
let S;try{S=JSON.parse(localStorage.getItem("seh1"))}catch(e){}
if(!S||!S.courses)S={courses:seed.map(mk),sel:null};
S.sel=S.sel||S.courses[0]?.id;
let selFile=null,noteMode="edit",editId=null,burl=null,canW=true;
const save=()=>{try{localStorage.setItem("seh1",JSON.stringify(S))}catch(e){$("#bn").textContent="บันทึกไม่สำเร็จ: พื้นที่เก็บข้อมูลเต็มหรือถูกปิดไว้"}};
const dbp=new Promise(r=>{try{const q=indexedDB.open("seh",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const dbop=async(m,fn)=>{const d=await dbp;if(!d)return null;return new Promise(r=>{const t=d.transaction("f",m),x=fn(t.objectStore("f"));t.oncomplete=()=>r(x&&x.result);t.onerror=()=>r(null)})};
const putF=(k,b)=>dbop("readwrite",s=>s.put(b,k)),getF=k=>dbop("readonly",s=>s.get(k)),delF=k=>dbop("readwrite",s=>s.delete(k));
const cur=()=>S.courses.find(c=>c.id===S.sel);
const prog=c=>{const t=STEPS.length+c.items.length;return Math.round((STEPS.filter(s=>c.checks[s[0]]).length+c.items.filter(i=>i.read).length)/t*100)};
const exD=c=>new Date(c.exam.length===10?c.exam+"T00:00":c.exam);
const days=c=>c.exam?Math.floor((exD(c)-Date.now())/864e5):null;
const fmt=c=>exD(c).toLocaleString("th-TH",{dateStyle:"medium",timeStyle:"short"})+" น.";
const hrs=c=>Math.floor(((exD(c)-Date.now())%864e5)/36e5);
const ask=m=>new Promise(r=>{$("#dqm").textContent=m;dq.showModal();const f=v=>{dq.close();r(v)};$("#dqy").onclick=()=>f(true);$("#dqn").onclick=()=>f(false);dq.oncancel=()=>r(false)});
function md(t){let h=esc(t).replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/^[-*] (.*)$/gm,"<li>$1</li>");return h.replace(/\n(?!<)/g,"<br>")}
function side(){
 const q=$("#q").value.toLowerCase(),cat=$("#cat").value;
 const cats=[...new Set(S.courses.map(c=>c.cat).filter(Boolean))];
 $("#cat").innerHTML='<option value="">ทุกหมวดหมู่</option>'+cats.map(c=>`<option ${c===cat?"selected":""}>${esc(c)}</option>`).join("");
 $("#cl").innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join("");
 const L=S.courses.filter(c=>(!cat||c.cat===cat)&&(!q||[c.code,c.en,c.th,c.cat,...c.items.map(i=>i.title+" "+i.type)].join(" ").toLowerCase().includes(q)));
 $("#list").innerHTML=L.length?L.map(c=>`<div class="c ${c.id===S.sel?"on":""}" data-id="${c.id}" tabindex="0"><span class="code">${esc(c.code)}</span> <small>${esc(c.cat)}</small><div>${esc(c.en)}</div><div class="bar"><i style="width:${prog(c)}%"></i></div></div>`).join(""):'<div class="empty">ไม่พบวิชาที่ตรงกับคำค้นหา</div>';
}
function main(){
 const c=cur(),m=$("#main");
 if(!c){m.innerHTML='<div class="empty">ยังไม่มีวิชา กด "เพิ่มวิชาใหม่" เพื่อเริ่มต้น</div>';return}
 const d=days(c),p=prog(c),q=$("#q").value.toLowerCase();
 const cdTxt=d===null?'<div class="n">–</div><small>ยังไม่ได้ตั้งวันสอบ</small>':d<0?'<div class="n x">สอบแล้ว</div><small>'+fmt(c)+'</small>':`<div class="n ${d<=7?"w":""}">${d===0?hrs(c)+" ชม.":d}</div><small>${d===0?"ก่อนสอบ":"วัน "+hrs(c)+" ชม. ก่อนสอบ"} · ${fmt(c)}</small>`;
 const L=c.items.filter(i=>!q||(i.title+" "+i.type).toLowerCase().includes(q));
 m.innerHTML=`<div class="hd"><div><span class="code">${esc(c.code)}</span> <span class="tag">${esc(c.cat||"ทั่วไป")}</span><h2>${esc(c.en)}</h2><p>${esc(c.th)}</p>
 <div class="row" style="margin-top:8px"><button id="ec">แก้ไขวิชา</button><button class="d" id="dl">ลบวิชา</button><label class="row" style="color:var(--mu)">วันและเวลาสอบ <input type="datetime-local" id="ex" value="${c.exam&&c.exam.length===10?c.exam+"T09:00":c.exam||""}" style="width:auto"></label></div></div>
 <div class="cd">${cdTxt}</div></div>
 <div class="box"><div class="row"><b>ความพร้อมก่อนสอบ</b><span class="sp"></span><b style="color:var(--ac)">${p}%</b></div><div class="bar" style="height:10px"><i style="width:${p}%"></i></div>
 <div class="row" style="margin-top:8px;gap:18px">${STEPS.map(s=>`<label class="chk"><input type="checkbox" data-s="${s[0]}" ${c.checks[s[0]]?"checked":""}>${s[1]}</label>`).join("")}</div></div>
 <div class="grid"><div class="box"><div class="row"><h3 style="margin:0">เนื้อหา & ไฟล์</h3><span class="sp"></span><button class="p" id="ai">+ เพิ่มเนื้อหา</button></div>
 <div style="margin:10px 0">${L.length?L.map(i=>`<div class="f ${i.id===selFile?"on":""}"><input type="checkbox" data-r="${i.id}" ${i.read?"checked":""} title="อ่านแล้ว"><span class="t" data-o="${i.id}">${esc(i.title)}</span><span class="tag">${esc(i.type)}</span><button class="d" data-x="${i.id}" title="ลบ" style="padding:2px 8px">✕</button></div>`).join(""):'<div class="empty">ยังไม่มีเนื้อหา อัปโหลดไฟล์หรือใส่ลิงก์เพื่อเริ่มอ่านได้เลย</div>'}</div>
 <div class="view" id="vw"><div class="empty">เลือกไฟล์จากรายการเพื่อเปิดอ่านที่นี่</div></div><div id="vb" class="row" style="margin-top:8px"></div></div>
 <div class="box"><div class="tabs"><button data-n="edit" class="${noteMode==="edit"?"on":""}">เขียนโน้ต</button><button data-n="prev" class="${noteMode==="prev"?"on":""}">ดูตัวอย่าง</button></div>
 ${noteMode==="edit"?`<textarea id="nt" placeholder="จดสรุปเป็น Markdown ได้ เช่น # หัวข้อ, **ตัวหนา**, - รายการ">${esc(c.notes)}</textarea>`:`<div class="md view" style="height:auto;min-height:300px">${c.notes?md(c.notes):'<span style="color:var(--mu)">ยังไม่มีโน้ต</span>'}</div>`}</div></div>`;
 if(selFile)openFile(selFile);
}
async function openFile(id){
 const i=cur().items.find(x=>x.id===id),v=$("#vw");if(!i||!v)return;
 if(burl){URL.revokeObjectURL(burl);burl=null}
 if(i.url){v.innerHTML=`<iframe src="${esc(i.url)}" referrerpolicy="no-referrer"></iframe>`;$("#vb").innerHTML=`<small style="color:var(--mu)">ถ้าเว็บไม่แสดงผล (บางเว็บบล็อกการฝัง) </small><a href="${esc(i.url)}" target="_blank" rel="noopener" style="color:var(--ac)">เปิดในแท็บใหม่</a>`;return}
 const b=await getF(i.id);if(!b){v.innerHTML='<div class="empty">ไม่พบไฟล์ในเบราว์เซอร์นี้ (ไฟล์ที่อัปโหลดเก็บเฉพาะในเครื่อง)</div>';return}
 burl=URL.createObjectURL(b);
 $("#vb").innerHTML=`<a href="${burl}" download="${esc(i.name||i.title)}"><button>⬇ ดาวน์โหลด</button></a><a href="${burl}" target="_blank"><button>เปิดในแท็บใหม่</button></a>`;
 if(b.type.startsWith("image/"))v.innerHTML=`<img src="${burl}" alt="">`;
 else if(/^text\//.test(b.type)||/\.(md|txt)$/i.test(i.name||i.title))v.innerHTML=`<div class="md">${md(await b.text())}</div>`;
 else if(b.type==="application/pdf"||/\.pdf$/i.test(i.name||""))v.innerHTML=`<iframe src="${burl}" title="${esc(i.title)}"></iframe>`;
 else v.innerHTML='<div class="empty">ไม่รองรับตัวอย่างไฟล์ชนิดนี้ ใช้ปุ่มดาวน์โหลดด้านล่าง</div>';
}
function all(){side();main()}
document.addEventListener("click",e=>{
 const t=e.target,c=cur();
 const card=t.closest(".c");if(card){S.sel=card.dataset.id;selFile=null;save();all();return}
 if(t.dataset.o){selFile=t.dataset.o;main();return}
 if(t.dataset.x){const i=c.items.find(x=>x.id===t.dataset.x);if(i)ask("ลบ \""+i.title+"\" ?").then(ok=>{if(ok){delF(i.id);c.items=c.items.filter(x=>x!==i);if(selFile===i.id)selFile=null;save();all()}});return}
 if(t.dataset.n){noteMode=t.dataset.n;main();return}
 if(t.id==="addc"){editId=null;$("#dct").textContent="เพิ่มวิชาใหม่";$("#fc").reset();dc.showModal()}
 if(t.id==="ec"){editId=c.id;$("#dct").textContent="แก้ไขวิชา";const f=$("#fc").elements;["code","en","th","cat","exam"].forEach(k=>f[k].value=(k==="exam"&&c.exam?.length===10?c.exam+"T09:00":c[k])||"");dc.showModal()}
 if(t.id==="dl")ask("ลบวิชา "+c.code+" และเนื้อหาทั้งหมด?").then(ok=>{if(ok){c.items.forEach(i=>delF(i.id));S.courses=S.courses.filter(x=>x!==c);S.sel=S.courses[0]?.id;selFile=null;save();all()}});
 if(t.id==="ai"){$("#fi").reset();di.showModal()}
 if(t.id==="th"){const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light"}
});
document.addEventListener("change",e=>{
 const t=e.target,c=cur();
 if(t.dataset.s){c.checks[t.dataset.s]=t.checked;save();all()}
 if(t.dataset.r){c.items.find(i=>i.id===t.dataset.r).read=t.checked;save();side();main()}
 if(t.id==="ex"){c.exam=t.value;save();main()}
});
document.addEventListener("input",e=>{
 if(e.target.id==="nt"){cur().notes=e.target.value;save()}
 if(e.target.id==="q"){side();if(cur())main()}
});
$("#cat").onchange=side;
$("#list").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.id)e.target.click()});
$("#fc").onsubmit=()=>{const f=Object.fromEntries(new FormData($("#fc")));
 if(editId)Object.assign(S.courses.find(c=>c.id===editId),f);
 else{const c=mk([f.code,f.en,f.th,f.cat]);c.exam=f.exam;S.courses.push(c);S.sel=c.id}
 save();all()};
$("#fi").onsubmit=async()=>{const f=new FormData($("#fi")),file=f.get("file"),c=cur();
 const it={id:uid(),title:f.get("title"),type:f.get("type")};
 if(file&&file.size){it.name=file.name;await putF(it.id,file)}else if(f.get("url")){it.url=f.get("url");it.type="Link"}else return;
 c.items.push(it);selFile=it.id;save();all()};
all();
</script></body></html>
